<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — NexaPrep</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="brand">
      <div class="badge">NEXAPREP</div>
      <h1>Welcome back</h1>
      <p>Log in to continue your exam preparation on NexaPrep.</p>
    </div>

    <div class="card">
      <div id="alertBox" class="alert alert-error hidden"></div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Log In</button>
      </form>

      <p class="helper-text">Don't have an account? <a href="register.html">Register</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert('alertBox');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';

      try {
        const data = await apiRequest('/auth/login', {
          method: 'POST',
          auth: false,
          body: {
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
          }
        });

        setToken(data.token);
        setStudentInfo(data.student);
        window.location.href = 'dashboard.html';
      } catch (err) {
        showAlert('alertBox', err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
