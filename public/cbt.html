<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBT Exam — NexaPrep</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="top-bar glass">
    <div class="logo">NEXA<span>PREP</span> CBT</div>
    <button id="exitBtn">Exit</button>
  </div>

  <div class="container">
    <div id="alertBox" class="alert alert-error hidden"></div>

    <!-- Loading -->
    <div id="loadingState" class="empty-state">Loading examination...</div>

    <!-- Question-count picker (shown before the exam starts) -->
    <div id="countPickerState" class="hidden">
      <div class="card">
        <div class="section-title" style="margin-top:0;">How many questions?</div>
        <p class="small-muted">Choose how many questions you want in this attempt.</p>
        <div id="countOptionsWrap" class="grid cols-4" style="margin-bottom:16px;"></div>
        <div class="field" style="max-width:280px;">
          <label for="customCountInput">Or type an exact number (max <span id="customCountMax">0</span>)</label>
          <input type="number" id="customCountInput" min="1">
        </div>
        <button class="btn btn-primary" id="startExamBtn" disabled style="margin-top:8px;">Start Exam</button>
      </div>
    </div>

    <!-- Exam UI -->
    <div id="examState" class="hidden">
      <div class="exam-header">
        <div class="small-muted" id="questionCounter">Question 1 of 10</div>
        <div class="timer" id="timerDisplay">30:00</div>
      </div>

      <div class="card">
        <div id="questionText" style="font-weight:700; font-size:16px; margin-bottom:16px;"></div>
        <div id="optionsList"></div>
      </div>

      <div class="q-nav" id="qNav"></div>

      <div class="exam-footer">
        <button class="btn btn-secondary" id="prevBtn">Previous</button>
        <button class="btn btn-secondary" id="nextBtn">Next</button>
      </div>
      <div style="margin-top:12px;">
        <button class="btn btn-primary" id="submitBtn">Submit Examination</button>
      </div>
    </div>

    <!-- Result UI -->
    <div id="resultState" class="hidden">
      <div class="card">
        <div class="result-summary">
          <div class="score" id="scoreValue">0%</div>
          <div class="out-of" id="scoreDetail"></div>
        </div>
        <div class="grid cols-4">
          <div class="stat-card"><div class="value" id="statTotal">0</div><div class="label">Total Questions</div></div>
          <div class="stat-card"><div class="value" id="statAttempted">0</div><div class="label">Attempted</div></div>
          <div class="stat-card"><div class="value" id="statCorrect">0</div><div class="label">Correct</div></div>
          <div class="stat-card"><div class="value" id="statWrong">0</div><div class="label">Wrong</div></div>
        </div>
        <div style="display:flex; gap:10px; margin-top:20px;">
          <button class="btn btn-secondary" id="viewCorrectionsBtn">Review My Answers</button>
          <button class="btn btn-primary" id="backToCourseBtn">Back to Course</button>
        </div>
      </div>

      <div id="correctionsWrap" class="hidden" style="margin-top:20px;"></div>
    </div>

    <!-- Review-only state (revisiting a past attempt via ?resultId=) -->
    <div id="reviewOnlyState" class="hidden">
      <div class="card">
        <div class="result-summary">
          <div class="score" id="reviewScoreValue">0%</div>
          <div class="out-of" id="reviewScoreDetail"></div>
        </div>
        <button class="btn btn-primary" style="margin-top:20px;" id="reviewBackBtn">Back to Course</button>
      </div>
      <div id="reviewCorrectionsWrap" style="margin-top:20px;"></div>
    </div>

    <!-- Empty state (no questions yet) -->
    <div id="noQuestionsState" class="hidden empty-state">
      No questions are available for this course yet. Please check back later.
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    requireStudentAuth();
    const params = new URLSearchParams(window.location.search);
    const courseId = params.get('courseId');
    const reviewResultId = params.get('resultId');
    if (!courseId) window.location.href = 'dashboard.html';

    document.getElementById('exitBtn').addEventListener('click', () => {
      if (confirm('Exit the exam? Your progress will not be saved.')) {
        window.location.href = `course.html?courseId=${courseId}`;
      }
    });
    document.getElementById('backToCourseBtn').addEventListener('click', () => {
      window.location.href = `course.html?courseId=${courseId}`;
    });
    document.getElementById('reviewBackBtn').addEventListener('click', () => {
      window.location.href = `course.html?courseId=${courseId}`;
    });

    function renderBreakdown(breakdown) {
      return breakdown.map((b, i) => `
        <div class="card" style="margin-bottom:12px; border-left:4px solid ${b.isCorrect ? '#1e9e5a' : '#d64545'};">
          <div style="font-weight:700;">${i + 1}. ${b.text}</div>
          <ul style="margin:10px 0 0; padding-left:18px;">
            ${b.options.map((o, idx) => {
              let style = '';
              let tag = '';
              if (idx === b.correctIndex) { style = 'font-weight:700; color:#1e9e5a;'; tag = ' ✓ correct answer'; }
              if (idx === b.selected && idx !== b.correctIndex) { style = 'font-weight:700; color:#d64545;'; tag = ' ✗ your answer'; }
              if (idx === b.selected && idx === b.correctIndex) { tag = ' ✓ correct answer (your answer)'; }
              return `<li style="${style}">${o}${tag}</li>`;
            }).join('')}
          </ul>
          ${b.selected === null ? '<div class="small-muted" style="margin-top:8px;">You did not attempt this question.</div>' : ''}
          ${(!b.isCorrect && b.explanation) ? `<div class="alert alert-error" style="margin-top:10px;"><strong>Explanation:</strong> ${b.explanation}</div>` : ''}
        </div>
      `).join('');
    }

    // ---- Review-only mode: revisiting a past, already-submitted attempt ----
    async function loadReviewOnly() {
      document.getElementById('loadingState').classList.add('hidden');
      try {
        const { result, breakdown } = await apiRequest(`/cbt/results/${reviewResultId}/review`);
        document.getElementById('reviewOnlyState').classList.remove('hidden');
        document.getElementById('reviewScoreValue').textContent = `${result.scorePercent}%`;
        document.getElementById('reviewScoreDetail').textContent = `${result.correct} out of ${result.totalQuestions} correct — submitted ${new Date(result.submittedAt).toLocaleString()}`;
        document.getElementById('reviewCorrectionsWrap').innerHTML = renderBreakdown(breakdown);
      } catch (err) {
        showAlert('alertBox', err.message);
      }
    }

    if (reviewResultId) {
      loadReviewOnly();
    } else {
      loadCountPicker();
    }

    let questions = [];
    let currentIndex = 0;
    const answers = {}; // { questionId: selectedOptionId } — optionId is the option's ORIGINAL index, not its shuffled position
    let remainingSeconds = 30 * 60; // overwritten by the course's configured duration once loaded
    let timerInterval = null;
    let selectedCount = null; // null = all questions

    // ---- Question-count picker: shown before the exam starts ----
    async function loadCountPicker() {
      try {
        const { totalQuestions } = await apiRequest(`/cbt/${courseId}/meta`);
        document.getElementById('loadingState').classList.add('hidden');

        if (!totalQuestions) {
          document.getElementById('noQuestionsState').classList.remove('hidden');
          return;
        }

        const availableCounts = [];
        for (let c = 10; c < totalQuestions; c += 10) availableCounts.push(c);

        const wrap = document.getElementById('countOptionsWrap');
        wrap.innerHTML = availableCounts.map(c => `
          <button type="button" class="btn btn-outline count-option" data-count="${c}">${c} Questions</button>
        `).join('') + `
          <button type="button" class="btn btn-outline count-option" data-count="all">All (${totalQuestions})</button>
        `;

        wrap.querySelectorAll('.count-option').forEach(btn => {
          btn.addEventListener('click', () => {
            wrap.querySelectorAll('.count-option').forEach(b => b.classList.remove('btn-primary'));
            document.getElementById('customCountInput').value = '';
            btn.classList.add('btn-primary');
            selectedCount = btn.dataset.count === 'all' ? null : parseInt(btn.dataset.count, 10);
            document.getElementById('startExamBtn').disabled = false;
          });
        });

        const customInput = document.getElementById('customCountInput');
        customInput.max = totalQuestions;
        document.getElementById('customCountMax').textContent = totalQuestions;
        customInput.addEventListener('input', () => {
          const val = parseInt(customInput.value, 10);
          wrap.querySelectorAll('.count-option').forEach(b => b.classList.remove('btn-primary'));
          if (!Number.isNaN(val) && val > 0) {
            selectedCount = val >= totalQuestions ? null : val;
            document.getElementById('startExamBtn').disabled = false;
          } else {
            document.getElementById('startExamBtn').disabled = true;
          }
        });

        document.getElementById('countPickerState').classList.remove('hidden');
      } catch (err) {
        document.getElementById('loadingState').classList.add('hidden');
        showAlert('alertBox', err.message);
      }
    }

    document.getElementById('startExamBtn').addEventListener('click', () => {
      document.getElementById('countPickerState').classList.add('hidden');
      document.getElementById('loadingState').classList.remove('hidden');
      init();
    });

    async function init() {
      try {
        const query = selectedCount ? `?count=${selectedCount}` : '';
        const { questions: qs, durationMinutes } = await apiRequest(`/cbt/${courseId}/questions${query}`);
        questions = qs;
        remainingSeconds = (durationMinutes || 30) * 60;
        document.getElementById('loadingState').classList.add('hidden');

        if (!questions.length) {
          document.getElementById('noQuestionsState').classList.remove('hidden');
          return;
        }

        document.getElementById('examState').classList.remove('hidden');
        renderQuestionNav();
        renderQuestion();
        startTimer();
      } catch (err) {
        document.getElementById('loadingState').classList.add('hidden');
        showAlert('alertBox', err.message);
      }
    }

    function startTimer() {
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        remainingSeconds--;
        updateTimerDisplay();
        if (remainingSeconds <= 0) {
          clearInterval(timerInterval);
          submitExam();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const m = Math.floor(remainingSeconds / 60).toString().padStart(2, '0');
      const s = (remainingSeconds % 60).toString().padStart(2, '0');
      document.getElementById('timerDisplay').textContent = `${m}:${s}`;
    }

    function renderQuestionNav() {
      const nav = document.getElementById('qNav');
      nav.innerHTML = questions.map((q, i) => {
        const answered = answers[q.id] !== undefined;
        const isCurrent = i === currentIndex;
        return `<button data-index="${i}" class="${isCurrent ? 'current' : ''} ${answered ? 'answered' : ''}">${i + 1}</button>`;
      }).join('');
      nav.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          currentIndex = parseInt(btn.dataset.index, 10);
          renderQuestion();
          renderQuestionNav();
        });
      });
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      document.getElementById('questionCounter').textContent = `Question ${currentIndex + 1} of ${questions.length}`;
      document.getElementById('questionText').textContent = q.text;

      const optionsList = document.getElementById('optionsList');
      optionsList.innerHTML = q.options.map(opt => {
        const selected = answers[q.id] === opt.optionId;
        return `
          <div class="option-row ${selected ? 'selected' : ''}" data-option-id="${opt.optionId}">
            <input type="radio" name="option" ${selected ? 'checked' : ''}>
            <span>${opt.text}</span>
          </div>
        `;
      }).join('');

      optionsList.querySelectorAll('.option-row').forEach(row => {
        row.addEventListener('click', () => {
          answers[q.id] = parseInt(row.dataset.optionId, 10);
          renderQuestion();
          renderQuestionNav();
        });
      });

      document.getElementById('prevBtn').disabled = currentIndex === 0;
      document.getElementById('nextBtn').disabled = currentIndex === questions.length - 1;
    }

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (currentIndex > 0) { currentIndex--; renderQuestion(); renderQuestionNav(); }
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
      if (currentIndex < questions.length - 1) { currentIndex++; renderQuestion(); renderQuestionNav(); }
    });
    document.getElementById('submitBtn').addEventListener('click', () => {
      if (confirm('Submit your examination now?')) submitExam();
    });

    async function submitExam() {
      clearInterval(timerInterval);
      try {
        const { result, breakdown } = await apiRequest(`/cbt/${courseId}/submit`, {
          method: 'POST',
          body: { answers, questionIds: questions.map(q => q.id) }
        });

        document.getElementById('examState').classList.add('hidden');
        document.getElementById('resultState').classList.remove('hidden');
        document.getElementById('scoreValue').textContent = `${result.scorePercent}%`;
        document.getElementById('scoreDetail').textContent = `${result.correct} out of ${result.totalQuestions} correct`;
        document.getElementById('statTotal').textContent = result.totalQuestions;
        document.getElementById('statAttempted').textContent = result.attempted;
        document.getElementById('statCorrect').textContent = result.correct;
        document.getElementById('statWrong').textContent = result.wrong;

        lastBreakdown = breakdown;
      } catch (err) {
        showAlert('alertBox', err.message);
      }
    }

    let lastBreakdown = [];
    document.getElementById('viewCorrectionsBtn').addEventListener('click', () => {
      const wrap = document.getElementById('correctionsWrap');
      const isHidden = wrap.classList.contains('hidden');
      if (isHidden) {
        wrap.innerHTML = renderBreakdown(lastBreakdown);
        wrap.classList.remove('hidden');
        document.getElementById('viewCorrectionsBtn').textContent = 'Hide Review';
      } else {
        wrap.classList.add('hidden');
        document.getElementById('viewCorrectionsBtn').textContent = 'Review My Answers';
      }
    });
  </script>
</body>
</html>
